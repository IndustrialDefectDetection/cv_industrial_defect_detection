version: "3.8"

services:
  # Steel Defect Detection API
  defect-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: steel-defect-api
    ports:
      - "8080:8080"
    environment:
      - MODEL_PATH=/app/models/best.pt
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - steel-network

  # MLflow Tracking Server
  mlflow:
    image: python:3.10-slim
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ../mlruns:/mlruns
    command: >
      sh -c "pip install mlflow && 
             mlflow server 
             --backend-store-uri file:///mlruns 
             --host 0.0.0.0 
             --port 5000"
    restart: unless-stopped
    networks:
      - steel-network

networks:
  steel-network:
    driver: bridge
