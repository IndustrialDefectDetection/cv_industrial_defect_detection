[project]
name = "manufacturing-operations-hub"
version = "1.0.0"
description = "A comprehensive platform providing manufacturing operations interfaces powered by Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Manufacturing Operations Hub Team"}
]
license = {file = "LICENSE"}
keywords = ["manufacturing", "operations", "mes", "streamlit", "bedrock", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "streamlit>=1.54.0",
    "pandas>=2.3.0",
    "numpy>=2.1.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.2.2",
    "boto3>=1.35.0",
    "strands-agents>=1.0",
    "Faker>=33.0.0",
    "fastapi>=0.139.2",
    "SQLAlchemy>=2.0.36",
    "psycopg2-binary>=2.9.9",
    "requests>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1.0",
    "pytest>=9.0.3",
    "black>=26.3.1",
    "flake8>=7.1.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/your-org/manufacturing-operations-hub"
Repository = "https://github.com/your-org/manufacturing-operations-hub.git"
Issues = "https://github.com/your-org/manufacturing-operations-hub/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_factory"]

[dependency-groups]
dev = [
    "jupyter>=1.1.0",
    "pytest>=9.0.3",
    "black>=26.3.1",
    "flake8>=7.1.0",
    "mypy>=1.13.0",
]

[tool.uv]
# Security floors for transitive dependencies already present in the runtime
# and dev graphs. Constraints do not install new packages; they prevent future
# lock refreshes from selecting versions below known patched releases.
constraint-dependencies = [
    "bleach>=6.4.0",
    "click>=8.3.3",
    "cryptography>=48.0.1",
    "gitpython>=3.1.55",
    "idna>=3.15",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.6.2",
    "mcp>=1.28.1",
    "mistune>=3.3.0",
    "nbconvert>=7.17.1",
    "notebook>=7.5.6",
    "pillow>=12.3.0",
    "pyarrow>=23.0.1",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "setuptools>=83.0.0",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
    "tornado>=6.5.7",
    "urllib3>=2.7.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
